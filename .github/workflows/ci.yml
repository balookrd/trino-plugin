name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the Trino version in pom.xml
  TRINO_VERSION: '477'
  JAVA_VERSION: '24'
  MAVEN_ARGS: -B --no-transfer-progress

jobs:
  trino:
    # Trino 477 artifacts other than trino-root and trino-spi are not published to Maven Central,
    # so the modules the plugins depend on are built from the release tag and cached
    name: Trino artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Trino version
        run: grep -q "<version>${TRINO_VERSION}</version>" pom.xml || { echo "pom.xml does not use Trino ${TRINO_VERSION}"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Maven repository
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-trino-${{ env.TRINO_VERSION }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-trino-${{ env.TRINO_VERSION }}-

      - name: Check Trino artifacts
        id: artifacts
        run: |
          if [ -f ~/.m2/repository/io/trino/trino-base-jdbc/"${TRINO_VERSION}"/trino-base-jdbc-"${TRINO_VERSION}"-tests.jar ] \
              && [ -f ~/.m2/repository/io/trino/trino-postgresql/"${TRINO_VERSION}"/trino-postgresql-"${TRINO_VERSION}".jar ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Trino
        if: steps.artifacts.outputs.present != 'true'
        uses: actions/checkout@v4
        with:
          repository: trinodb/trino
          ref: ${{ env.TRINO_VERSION }}
          path: trino-src

      - name: Build Trino modules
        if: steps.artifacts.outputs.present != 'true'
        working-directory: trino-src
        run: >
          ./mvnw install -DskipTests
          -Dair.check.skip-all=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true
          -pl plugin/trino-postgresql,plugin/trino-geospatial,plugin/trino-base-jdbc,plugin/trino-tpch,testing/trino-testing,testing/trino-testing-services,core/trino-main
          -am

      - name: Resolve plugin dependencies
        run: mvn dependency:go-offline -DexcludeGroupIds=io.trino.contrib

      - name: Save Maven repository
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: m2-trino-${{ env.TRINO_VERSION }}-${{ hashFiles('**/pom.xml') }}

  test:
    name: Test ${{ matrix.name }}
    needs: trino
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Greenplum 6
            module: trino-greenplum
            properties: -Dtesting.greenplum-image-name=woblerr/greenplum:6.27.1
            artifact: true
          - name: Greenplum 7
            module: trino-greenplum
            properties: -Dtesting.greenplum-image-name=woblerr/greenplum:7.1.0
          - name: Doris 3.0
            module: trino-doris
            properties: -Dtesting.doris-image-name=apache/doris:3.0.8-all
            artifact: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Maven repository
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-trino-${{ env.TRINO_VERSION }}-${{ hashFiles('**/pom.xml') }}
          fail-on-cache-miss: true

      - name: Build and test
        run: mvn verify -pl ${{ matrix.module }} -am ${{ matrix.properties }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.name }}
          path: '**/target/surefire-reports'

      - name: Upload plugin
        if: matrix.artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-${{ env.TRINO_VERSION }}
          path: ${{ matrix.module }}/target/${{ matrix.module }}-${{ env.TRINO_VERSION }}.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: trino-*-${{ env.TRINO_VERSION }}
          merge-multiple: true

      # Third-party action with write access: pinned to a commit
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: '*.zip'
          generate_release_notes: true
